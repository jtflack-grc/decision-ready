# Builds the Vite app with base=/repo-name/ and deploys dist/ to GitHub Pages.
# After the first push, enable Pages: Settings → Pages → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # Many runners set NODE_ENV=production, which makes plain `npm ci` skip
      # devDependencies — but this project needs them to run `tsc` and `vite build`.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
